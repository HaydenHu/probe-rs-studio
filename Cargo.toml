[package]
name = "probe-rs-studio"
version = "0.2.0"
edition = "2021"
description = "A DSH-style desktop flashing workbench built directly on the probe-rs library"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.37"
# egui 0.37 can rasterise COLR/CBDT colour emoji, but the feature lives on
# epaint and is NOT re-exported by egui/eframe. Enabling it directly on the
# same epaint package instance turns the system emoji font into real colour.
epaint = { version = "0.37", features = ["color_fonts"] }
# Maintained fork: the daplink-hid-fallback branch carries the CMSIS-DAP v1
# HID packet-size fallback required by DAPLink clones that never answer
# DAP_Info(PacketSize). See README for the local path-override workflow.
probe-rs = { git = "https://github.com/HaydenHu/probe-rs", branch = "daplink-hid-fallback", default-features = false, features = [
    "builtin-targets",
    "cmsisdap_v1",
    "builtin-formats",
] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = "0.4"
anyhow = "1"
# CMSIS-Pack import (ZIP / pdsc XML / deflate / base64), pure Rust.
quick-xml = "0.41"
flate2 = "1"
base64 = "0.23"
