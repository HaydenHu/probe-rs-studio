# Dedicated option-byte (OB) flash algorithm for Puya PY32F003 / PY32F030.
#
# Source: Puya.PY32F0xx_DFP (Flash/PY32F0xx_OPT.FLM), which the vendor pack
# declares as:  start=0x1FFF0E80  size=0x00000010  default=0
# i.e. a 16-byte non-volatile option block, programmed with its own algorithm
# rather than the main Flash algorithm.
#
# This file is compiled into the binary via option_bytes::PY32_OPT_YAML and is
# NOT added to the general chip registry (it lives in assets/, not targets/),
# so it does not show up as a selectable chip in the chip library. Only the
# option-byte writer extracts its algorithm + NVM region and appends them to
# the currently selected target for the duration of one write job.
#
# Generated by: probe-rs-studio.exe --flm <PY32F0xx_OPT.FLM> --flash-base
#               0x1FFF0E80 --flash-size 0x10 --core armv6m
name: "PY32F0xx Option Bytes"
generated_from_pack: false
variants:
- name: "PY32F0xx-OB"
  cores:
  - name: main
    type: armv6m
    core_access_options: !Arm
      ap: !v1 0
  memory_map:
  - !Nvm
    name: "OPTION_BYTES"
    range:
      start: 0x1fff0e80
      end: 0x1fff0e90
    cores:
    - main
    access:
      write: false
      boot: true
  - !Ram
    name: "RAM"
    range:
      start: 0x20000000
      end: 0x20002000
    cores:
    - main
  flash_algorithms:
  - py32f0xx_opt
flash_algorithms:
- name: "py32f0xx_opt"
  description: "PY32F0xx Flash Options"
  default: true
  instructions: 
  pc_init: 0x7d
  pc_uninit: 0x121
  pc_program_page: 0x149
  pc_erase_sector: 0x141
  pc_erase_all: 0x13d
  pc_verify: 0x193
  pc_blank_check: 0x145
  data_section_offset: 0x1e8
  flash_properties:
    address_range:
      start: 0x1fff0e80
      end: 0x1fff0e90
    page_size: 0x10
    erased_byte_value: 0xff
    program_page_timeout: 3000
    erase_sector_timeout: 3000
    sectors:
    - size: 0x10
      address: 0x0
